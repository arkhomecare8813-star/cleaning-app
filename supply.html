<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>비품 구매 보고</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
<style>
:root{
  --bg:#0a0a0a;--sf:#161616;--sf2:#1e1e1e;--sf3:#272727;
  --bd:#2c2c2c;--accent:#ffb547;--a2:#3a2800;
  --text:#f0f0f0;--muted:#777;--danger:#ff4d6d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 80px;}
.wrap{width:100%;max-width:480px;}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
.logo-icon{width:38px;height:38px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.logo-title{font-size:18px;font-weight:900;letter-spacing:-0.5px;}
.logo-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:14px;}

.info-rows{display:flex;flex-direction:column;gap:12px;}
.info-row{display:flex;align-items:flex-start;gap:10px;}
.info-icon{font-size:18px;width:24px;flex-shrink:0;}
.info-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px;}
.info-val{font-size:15px;font-weight:800;}
.info-val.accent{color:var(--accent);}
.date-pill{display:inline-flex;align-items:center;gap:5px;background:var(--a2);color:var(--accent);padding:4px 12px;border-radius:20px;font-size:13px;font-weight:700;font-family:'DM Mono',monospace;}

.supply-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.supply-lbl{font-size:11px;color:var(--muted);margin-bottom:5px;}
.supply-inp{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:9px;padding:11px 13px;color:var(--text);font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;}
.supply-inp:focus{border-color:var(--accent);}

.receipt-zone{border:2px dashed var(--bd);border-radius:10px;padding:20px;text-align:center;cursor:pointer;background:var(--sf2);}
.receipt-preview{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.receipt-item{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--sf3);}
.receipt-item img{width:100%;height:100%;object-fit:cover;display:block;}
.receipt-remove{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.8);color:#fff;border:none;font-size:10px;cursor:pointer;line-height:1;}

.save-btn{width:100%;padding:16px;border-radius:13px;background:var(--accent);border:none;color:#000;font-size:16px;font-weight:900;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;}
.save-btn:hover{background:#ffc670;}
.save-btn:active{transform:scale(0.98);}
.save-btn:disabled{background:var(--sf3);color:var(--muted);cursor:not-allowed;transform:none;}

.success{text-align:center;padding:24px 10px;}
.success-emoji{font-size:64px;margin-bottom:14px;line-height:1;}
.success-title{font-size:22px;font-weight:900;color:var(--accent);margin-bottom:6px;}
.success-path{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:16px;}
.add-more{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}

.err-box{background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.3);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--danger);margin-top:12px;display:none;line-height:1.6;}

.invalid{text-align:center;padding:40px 20px;}
.invalid-icon{font-size:48px;margin-bottom:14px;}
.invalid-title{font-size:18px;font-weight:800;margin-bottom:6px;}
.invalid-sub{font-size:13px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">

  <div class="logo-row">
    <div class="logo-icon">🛒</div>
    <div>
      <div class="logo-title" id="app-title">청소팀 관리</div>
      <div class="logo-sub">비품 구매 보고</div>
    </div>
  </div>

  <!-- 잘못된 링크 -->
  <div class="card" id="invalid-card" style="display:none;">
    <div class="invalid">
      <div class="invalid-icon">❌</div>
      <div class="invalid-title">잘못된 링크입니다</div>
      <div class="invalid-sub">담당자에게 올바른 링크를 요청하세요.</div>
    </div>
  </div>

  <!-- 현장 정보 -->
  <div class="card" id="info-card">
    <div class="info-rows">
      <div class="info-row">
        <div class="info-icon">🏢</div>
        <div><div class="info-lbl">업체</div><div class="info-val" id="info-co">—</div></div>
      </div>
      <div class="info-row">
        <div class="info-icon">📍</div>
        <div><div class="info-lbl">현장</div><div class="info-val accent" id="info-site">—</div></div>
      </div>
      <div class="info-row">
        <div class="info-icon">📅</div>
        <div><div class="info-lbl">날짜</div><div class="date-pill" id="info-date">—</div></div>
      </div>
    </div>
  </div>

  <!-- 비품 입력 카드 -->
  <div class="card" id="supply-card">
    <div class="supply-row">
      <div><div class="supply-lbl">품목명</div><input type="text" id="supply-item" class="supply-inp" placeholder="예: 세제, 걸레"></div>
      <div><div class="supply-lbl">금액 (원)</div><input type="number" id="supply-amount" class="supply-inp" placeholder="예: 15000" inputmode="numeric"></div>
    </div>
    <div><div class="supply-lbl">영수증 사진 (선택)</div>
      <div class="receipt-zone" onclick="document.getElementById('receipt-input').click()">
        <div style="font-size:32px;margin-bottom:6px;">🧾</div>
        <div style="font-size:13px;font-weight:700;">영수증 사진 선택</div>
        <div style="font-size:11px;color:var(--muted);">없으면 건너뛰어도 됩니다</div>
      </div>
      <input type="file" id="receipt-input" accept="image/*" multiple style="display:none;" onchange="handleReceiptFiles(this.files)">
      <div id="receipt-preview" class="receipt-preview"></div>
    </div>

    <button class="save-btn" id="save-btn" onclick="startSave()" disabled>
      <span id="save-btn-text">품목명 또는 금액을 입력해주세요</span>
    </button>
    <div class="err-box" id="err-box"></div>
  </div>

  <!-- 완료 카드 -->
  <div class="card" id="success-card" style="display:none;">
    <div class="success">
      <div class="success-emoji">✅</div>
      <div class="success-title">비품 등록 완료!</div>
      <div class="success-path" id="success-path"></div>
      <button class="add-more" onclick="resetForm()">🛒 비품 추가 등록</button>
    </div>
  </div>

</div>

<script>
// ── 설정 (upload.html과 동일한 백엔드 사용, 완전 독립 실행) ──
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwTVLebbpES7ZYqeyI7Z-H8tZ8i4K7xr9Dq9I5WGDYDAxB195SbUJYkjcuWQb3eTg/exec';
var FB_URL = 'https://cleaning-498705-default-rtdb.asia-southeast1.firebasedatabase.app';
var TG_TOKEN = '8903150945:AAHP9TH-RILmcbHd3XMlZ4pUEWxfqWwQ02Q';
var TG_CHAT_ID = '8210077880';

var params = {};
var receiptFiles = [];
var isSaving = false;

function parseParams(){
  location.search.slice(1).split('&').forEach(function(p){
    var i = p.indexOf('=');
    if(i > -1) params[decodeURIComponent(p.slice(0,i))] = decodeURIComponent(p.slice(i+1));
  });
}

function init(){
  parseParams();
  // 최소 필수값: siteId + date만 있으면 됨 (co/site/title은 아래에서 Firebase 조회로 채움)
  if(!params.date || !params.siteId){
    document.getElementById('info-card').style.display = 'none';
    document.getElementById('supply-card').style.display = 'none';
    document.getElementById('invalid-card').style.display = '';
    return;
  }
  document.getElementById('info-date').textContent = params.date;

  if(params.co && params.site){
    // 예전 방식(긴 링크, co/site가 이미 파라미터로 옴)도 계속 지원
    if(params.title) document.getElementById('app-title').textContent = params.title;
    document.getElementById('info-co').textContent = params.co;
    document.getElementById('info-site').textContent = params.site;
    return;
  }

  // 짧은 링크: Firebase에서 현장 정보 조회
  document.getElementById('info-co').textContent = '불러오는 중...';
  document.getElementById('info-site').textContent = '불러오는 중...';
  fetch(FB_URL+'/data.json')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.title) document.getElementById('app-title').textContent = d.title;
      var found = d && Array.isArray(d.sites) ? d.sites.find(function(s){ return String(s.id)===String(params.siteId); }) : null;
      if(!found){
        document.getElementById('info-card').style.display = 'none';
        document.getElementById('supply-card').style.display = 'none';
        document.getElementById('invalid-card').style.display = '';
        return;
      }
      params.co = found.company || '';
      params.site = found.site || '';
      document.getElementById('info-co').textContent = params.co || '—';
      document.getElementById('info-site').textContent = params.site || '—';
    })
    .catch(function(){
      document.getElementById('info-co').textContent = '조회 실패';
      document.getElementById('info-site').textContent = '조회 실패';
    });
}

function updateBtn(){
  var item = document.getElementById('supply-item').value.trim();
  var amount = document.getElementById('supply-amount').value.trim();
  var btn = document.getElementById('save-btn');
  var txt = document.getElementById('save-btn-text');
  var ok = !!(item || amount);
  btn.disabled = !ok;
  txt.textContent = ok ? '🛒 비품 구매 등록' : '품목명 또는 금액을 입력해주세요';
}

function handleReceiptFiles(files){
  for(var i=0;i<files.length;i++){
    var f = files[i];
    var isDup = receiptFiles.some(function(s){ return s.name===f.name && s.size===f.size; });
    if(!isDup) receiptFiles.push(f);
  }
  renderReceiptPreview();
}

function renderReceiptPreview(){
  var wrap = document.getElementById('receipt-preview');
  wrap.innerHTML = '';
  receiptFiles.forEach(function(f, idx){
    var div = document.createElement('div');
    div.className = 'receipt-item';
    var img = document.createElement('img');
    var reader = new FileReader();
    reader.onload = function(e){ img.src = e.target.result; };
    reader.readAsDataURL(f);
    var rm = document.createElement('button');
    rm.className = 'receipt-remove';
    rm.innerHTML = '×';
    rm.onclick = function(){ receiptFiles.splice(idx,1); renderReceiptPreview(); };
    div.appendChild(img); div.appendChild(rm);
    wrap.appendChild(div);
  });
}

// ── 비품 저장 (Firebase supplies) ──
function saveSupplyToFirebase(item, amount, date, url){
  if(!FB_URL || !params.siteId) return;
  var supId = String(Date.now() + Math.floor(Math.random()*1000));
  fetch(FB_URL+'/data/supplies/'+supId+'.json', {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      id: parseInt(supId), co: params.co||'',
      siteId: String(params.siteId), siteName: params.site||'',
      item: item||'비품', amount: parseInt(amount)||0,
      date: date, receipt: !!url, url: url||''
    })
  }).catch(function(){});
}

function sendTelegramNotification(item, amount){
  if(!TG_TOKEN || !TG_CHAT_ID) return;
  var site = params.site || '알 수 없는 현장';
  var co   = params.co   || '';
  var date = params.date || '';
  function sendMsg(clientMgr){
    var sender = site + (clientMgr ? ' · ' + clientMgr : '');
    var lines = [
      '🛒 <b>' + sender + '</b>',
      '📅 ' + date + ' | 비품 구매 등록',
    ];
    if(co) lines.push('🏢 ' + co);
    lines.push('');
    if(item)   lines.push('품목: ' + item);
    if(amount) lines.push('금액: ' + Number(amount).toLocaleString() + '원');
    fetch('https://api.telegram.org/bot'+TG_TOKEN+'/sendMessage', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ chat_id: TG_CHAT_ID, text: lines.join('\n'), parse_mode:'HTML' })
    }).catch(function(){});
  }
  if(FB_URL && params.siteId){
    fetch(FB_URL+'/data/sites.json')
      .then(function(r){ return r.json(); })
      .then(function(sitesData){
        var found = Array.isArray(sitesData) ? sitesData.find(function(s){ return String(s.id)===String(params.siteId); }) : null;
        sendMsg(found && found.clientMgr ? found.clientMgr : '');
      })
      .catch(function(){ sendMsg(''); });
  } else {
    sendMsg('');
  }
}

// ── 영수증 리사이즈(HEIC 대응) + GAS 업로드 ──
function resizeFileToBase64(file){
  return new Promise(function(resolve){
    var isHeic = file.type==='image/heic' || file.type==='image/heif' || /\.(heic|heif)$/i.test(file.name||'');
    if(isHeic && typeof heic2any!=='undefined'){
      heic2any({ blob:file, toType:'image/jpeg', quality:0.85 })
        .then(function(blob){ return blobToBase64(blob, 'image/jpeg'); })
        .catch(function(){ return blobToBase64(file, file.type||'image/jpeg'); })
        .then(resolve);
    } else {
      blobToBase64(file, file.type||'image/jpeg').then(resolve);
    }
  });
}
function blobToBase64(blob, mime){
  return new Promise(function(resolve){
    var reader = new FileReader();
    reader.onload = function(e){
      resolve({ base64: e.target.result.split(',')[1], mime: mime,
                name: 'receipt_'+Date.now()+'_'+Math.random().toString(36).slice(2,5)+'.jpg' });
    };
    reader.readAsDataURL(blob);
  });
}

function uploadReceiptsAndSave(item, amount, date){
  var files = receiptFiles.slice();
  if(!files.length){ saveSupplyToFirebase(item, amount, date, null); return; }
  var done = 0;
  files.forEach(function(file){
    resizeFileToBase64(file).then(function(info){
      fetch(GAS_URL, { method:'POST', body: JSON.stringify({
        type:'receipt', co: params.co||'미분류', site: params.site||'미분류',
        date: date, memo:item, amount: parseInt(amount)||0,
        siteId: String(params.siteId||''), name: info.name, data: info.base64, mime: info.mime
      })}).catch(function(){});
      done++;
      if(done===files.length) saveSupplyToFirebase(item, amount, date, null);
    });
  });
}

function startSave(){
  if(isSaving) return;
  var item   = document.getElementById('supply-item').value.trim();
  var amount = document.getElementById('supply-amount').value.trim();
  if(!item && !amount){ return; }
  isSaving = true;

  var btn = document.getElementById('save-btn');
  var btnText = document.getElementById('save-btn-text');
  btn.disabled = true;
  btnText.textContent = '⏳ 등록 중...';
  document.getElementById('err-box').style.display = 'none';

  var date = params.date || new Date().toISOString().slice(0,10);
  var receiptCount = receiptFiles.length;

  sendTelegramNotification(item, amount);
  uploadReceiptsAndSave(item, amount, date);

  setTimeout(function(){
    isSaving = false;
    document.getElementById('supply-card').style.display = 'none';
    var sc = document.getElementById('success-card');
    sc.style.display = '';
    var pathHtml = '<strong>'+(params.site||'')+'</strong> 현장에 비품 구매 내역이<br>성공적으로 등록되었습니다.';
    if(receiptCount>0) pathHtml += '<br><span style="color:var(--accent);">🧾 영수증 '+receiptCount+'장도 함께 등록됩니다.</span>';
    document.getElementById('success-path').innerHTML = pathHtml;
  }, 600);
}

function resetForm(){
  receiptFiles = [];
  document.getElementById('receipt-preview').innerHTML = '';
  document.getElementById('receipt-input').value = '';
  document.getElementById('supply-item').value = '';
  document.getElementById('supply-amount').value = '';
  document.getElementById('err-box').style.display = 'none';
  document.getElementById('success-card').style.display = 'none';
  document.getElementById('supply-card').style.display = '';
  updateBtn();
}

document.addEventListener('input', function(e){
  if(e.target && (e.target.id==='supply-item' || e.target.id==='supply-amount')) updateBtn();
});

window.onload = function(){ init(); updateBtn(); };
</script>
</body>
</html>
