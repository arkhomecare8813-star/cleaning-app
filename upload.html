<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>현장 사진 업로드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
<style>
:root{
  --bg:#0a0a0a;--sf:#161616;--sf2:#1e1e1e;--sf3:#272727;
  --bd:#2c2c2c;--accent:#00e5a0;--a2:#004d36;
  --text:#f0f0f0;--muted:#777;--danger:#ff4d6d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 80px;}
.wrap{width:100%;max-width:480px;}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
.logo-icon{width:38px;height:38px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.logo-title{font-size:18px;font-weight:900;letter-spacing:-0.5px;}
.logo-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:14px;}

/* 현장 정보 */
.info-rows{display:flex;flex-direction:column;gap:12px;}
.info-row{display:flex;align-items:flex-start;gap:10px;}
.info-icon{font-size:18px;width:24px;flex-shrink:0;}
.info-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px;}
.info-val{font-size:15px;font-weight:800;}
.info-val.accent{color:var(--accent);}
.date-pill{display:inline-flex;align-items:center;gap:5px;background:var(--a2);color:var(--accent);padding:4px 12px;border-radius:20px;font-size:13px;font-weight:700;font-family:'DM Mono',monospace;}

/* 업로드 존 */
.upload-zone{border:2px dashed var(--bd);border-radius:14px;padding:36px 20px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--sf2);position:relative;}
.upload-zone.drag{border-color:var(--accent);background:rgba(0,229,160,0.06);}
.upload-zone.has-files{border-color:var(--accent);border-style:solid;}
.upload-big-icon{font-size:52px;margin-bottom:12px;line-height:1;}
.upload-text{font-size:16px;font-weight:800;margin-bottom:5px;}
.upload-sub{font-size:12px;color:var(--muted);line-height:1.6;}
#file-input{display:none;}

/* 미리보기 */
.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.preview-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sf3);}
.preview-item img{width:100%;height:100%;object-fit:cover;display:block;}
.preview-remove{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,0.75);color:#fff;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;font-weight:900;}
.preview-more{aspect-ratio:1;border-radius:10px;background:var(--sf3);border:1px dashed var(--bd);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);cursor:pointer;font-weight:700;}

/* 업로드 버튼 */
.upload-btn{width:100%;padding:16px;border-radius:13px;background:var(--accent);border:none;color:#000;font-size:16px;font-weight:900;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;}
.upload-btn:hover{background:#00ffb3;}
.upload-btn:active{transform:scale(0.98);}
.upload-btn:disabled{background:var(--sf3);color:var(--muted);cursor:not-allowed;transform:none;}

/* 진행바 */
.prog-wrap{margin-top:14px;display:none;}
.prog-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;color:var(--muted);}
.prog-bar{background:var(--sf3);border-radius:6px;height:8px;overflow:hidden;}
.prog-fill{background:var(--accent);height:100%;border-radius:6px;transition:width 0.3s;width:0%;}
.prog-file{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* 완료 */
.success{text-align:center;padding:24px 10px;}
.success-emoji{font-size:64px;margin-bottom:14px;line-height:1;}
.success-title{font-size:22px;font-weight:900;color:var(--accent);margin-bottom:6px;}
.success-count{font-family:'DM Mono',monospace;font-size:32px;font-weight:900;color:var(--accent);margin:10px 0;}
.success-path{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:16px;}
.success-path strong{color:var(--accent);}
.add-more{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}

/* 에러 */
.err-box{background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.3);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--danger);margin-top:12px;display:none;line-height:1.6;}

/* 잘못된 링크 */
.invalid{text-align:center;padding:40px 20px;}
.invalid-icon{font-size:48px;margin-bottom:14px;}
.invalid-title{font-size:18px;font-weight:800;margin-bottom:6px;}
.invalid-sub{font-size:13px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">

  <div class="logo-row">
    <div class="logo-icon">🧹</div>
    <div>
      <div class="logo-title" id="app-title">청소팀 관리</div>
      <div class="logo-sub">현장 사진 업로드</div>
    </div>
  </div>

  <!-- 잘못된 링크 -->
  <div class="card" id="invalid-card" style="display:none;">
    <div class="invalid">
      <div class="invalid-icon">❌</div>
      <div class="invalid-title">잘못된 링크입니다</div>
      <div class="invalid-sub">담당자에게 올바른 링크를 요청하세요.</div>
    </div>
  </div>

  <!-- 현장 정보 -->
  <div class="card" id="info-card">
    <div class="info-rows">
      <div class="info-row">
        <div class="info-icon">🏢</div>
        <div><div class="info-lbl">업체</div><div class="info-val" id="info-co">—</div></div>
      </div>
      <div class="info-row">
        <div class="info-icon">📍</div>
        <div><div class="info-lbl">현장</div><div class="info-val accent" id="info-site">—</div></div>
      </div>
      <div class="info-row">
        <div class="info-icon">📅</div>
        <div><div class="info-lbl">날짜</div><div class="date-pill" id="info-date">—</div></div>
      </div>
      <div class="info-row" id="mgr-row" style="display:none;">
        <div class="info-icon">👤</div>
        <div><div class="info-lbl">담당자</div><div class="info-val" id="info-mgr">—</div></div>
      </div>
    </div>
  </div>

  <!-- 업로드 카드 -->
  <div class="card" id="upload-card">
    <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
      <div class="upload-big-icon">📸</div>
      <div class="upload-text">사진을 탭해서 선택하세요</div>
      <div class="upload-sub">여러 장 동시 선택 가능<br>JPG · PNG · HEIC 모두 가능</div>
    </div>
    <input type="file" id="file-input" accept="image/*" multiple onchange="handleFiles(this.files)">
    <div class="preview-grid" id="preview-grid"></div>
    <button class="upload-btn" id="upload-btn" onclick="startUpload()" disabled>
      <span id="upload-btn-text">사진을 먼저 선택해주세요</span>
    </button>
    <textarea id="memo-input" placeholder="📝 에로사항 메모 (선택사항)&#10;특이사항, 요청사항 등을 입력하세요" style="width:100%;margin-top:12px;background:#1e1e1e;border:1px solid #2c2c2c;border-radius:10px;padding:12px;color:#f0f0f0;font-size:14px;font-family:'Noto Sans KR',sans-serif;resize:vertical;min-height:80px;outline:none;line-height:1.6;"></textarea>
    <div class="prog-wrap" id="prog-wrap">
      <div class="prog-top">
        <span id="prog-text">업로드 중...</span>
        <span id="prog-pct">0%</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
      <div class="prog-file" id="prog-file"></div>
    </div>
    <div class="err-box" id="err-box"></div>
  </div>

  <!-- 완료 카드 -->
  <div class="card" id="success-card" style="display:none;">
    <div class="success">
      <div class="success-emoji">✅</div>
      <div class="success-title">업로드 완료!</div>
      <div class="success-count" id="success-count">0장</div>
      <div class="success-path" id="success-path"></div>
      <button class="add-more" onclick="resetUpload()">📷 사진 추가하기</button>
    </div>
  </div>

</div>

<script>
// ── 설정 ──
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxOVap39LwyxR1bS58myL8kt-L9djapQp_lsuwRWBImvE0iFfXypSXK36PWv3wiGMLs/exec';
var FB_URL = 'https://cleaning-498705-default-rtdb.asia-southeast1.firebasedatabase.app';
var TG_TOKEN = '';
var TG_CHAT_ID = '';

// Firebase에서 텔레그램 설정 로드
if(FB_URL){
  fetch(FB_URL+'/data/tgConfig.json')
    .then(function(r){return r.json();})
    .then(function(d){
      if(d && d.token)  TG_TOKEN   = d.token;
      if(d && d.chatId) TG_CHAT_ID = d.chatId;
    }).catch(function(){});
}

var params = {};
var selectedFiles = [];

// ── URL 파라미터 파싱 ──
function parseParams(){
  location.search.slice(1).split('&').forEach(function(p){
    var i = p.indexOf('=');
    if(i > -1) params[decodeURIComponent(p.slice(0,i))] = decodeURIComponent(p.slice(i+1));
  });
}

// ── 초기화 ──
function init(){
  parseParams();

  // 파라미터 검증
  if(!params.co || !params.site || !params.date){
    document.getElementById('info-card').style.display = 'none';
    document.getElementById('upload-card').style.display = 'none';
    document.getElementById('invalid-card').style.display = '';
    return;
  }

  // 현장 정보 표시
  if(params.title) document.getElementById('app-title').textContent = params.title;
  document.getElementById('info-co').textContent = params.co;
  document.getElementById('info-site').textContent = params.site;
  document.getElementById('info-date').textContent = params.date;
  if(params.mgr){
    document.getElementById('info-mgr').textContent = params.mgr;
    document.getElementById('mgr-row').style.display = '';
  }
}

// ── 파일 선택 ──
function handleFiles(files){
  for(var i=0;i<files.length;i++){
    var f = files[i];
    // 파일명 + 크기 + 마지막수정시각 기준 중복 제거 (change 이벤트 중복 발화 방지)
    var isDup = selectedFiles.some(function(s){
      return s.name === f.name && s.size === f.size && s.lastModified === f.lastModified;
    });
    if(!isDup) selectedFiles.push(f);
  }
  renderPreviews();
  updateBtn();
}

function renderPreviews(){
  var grid = document.getElementById('preview-grid');
  grid.innerHTML = '';
  var show = Math.min(selectedFiles.length, 8);
  for(var i=0;i<show;i++){
    (function(idx){
      var div = document.createElement('div');
      div.className = 'preview-item';
      var img = document.createElement('img');
      var reader = new FileReader();
      reader.onload = function(e){ img.src = e.target.result; };
      reader.readAsDataURL(selectedFiles[idx]);
      var rm = document.createElement('button');
      rm.className = 'preview-remove';
      rm.innerHTML = '×';
      rm.onclick = function(e){
        e.stopPropagation();
        selectedFiles.splice(idx,1);
        renderPreviews(); updateBtn();
      };
      div.appendChild(img); div.appendChild(rm);
      grid.appendChild(div);
    })(i);
  }
  if(selectedFiles.length > 8){
    var more = document.createElement('div');
    more.className = 'preview-more';
    more.textContent = '+' + (selectedFiles.length-8) + '장';
    more.onclick = function(){ document.getElementById('file-input').click(); };
    grid.appendChild(more);
  }
  document.getElementById('upload-zone').classList.toggle('has-files', selectedFiles.length > 0);
}

function updateBtn(){
  var btn = document.getElementById('upload-btn');
  var txt = document.getElementById('upload-btn-text');
  if(!btn) return;
  btn.disabled = selectedFiles.length === 0;
  if(txt) txt.textContent = selectedFiles.length > 0 ? '📤 ' + selectedFiles.length + '장 업로드' : '사진을 먼저 선택해주세요';
}

// ── 업로드 ──
var isUploading = false;
var CONCURRENCY = 3; // 동시 업로드 최대 장수

function startUpload(){
  if(!selectedFiles.length || isUploading) return;
  isUploading = true;

  var btn = document.getElementById('upload-btn');
  var btnText = document.getElementById('upload-btn-text');
  btn.disabled = true;
  btnText.textContent = '⏳ 업로드 중...';
  document.getElementById('err-box').style.display = 'none';
  document.getElementById('prog-wrap').style.display = '';

  var total = selectedFiles.length;
  var done = 0;
  var failed = 0;

  updateProgress(0, total);

  // ── Promise 기반 리사이즈 ──
  function resizeFileToBase64(file){
    return new Promise(function(resolve){
      var isHeic = file.type === 'image/heic' || file.type === 'image/heif'
        || /\.(heic|heif)$/i.test(file.name||'');

      if(isHeic && typeof heic2any !== 'undefined'){
        heic2any({ blob: file, toType: 'image/jpeg', quality: 0.75 })
          .then(function(blob){ return resizeBlobToBase64(blob, file); })
          .catch(function(){ return fileToBase64(file); })
          .then(resolve);
      } else {
        resizeBlobToBase64(file, file).then(resolve);
      }
    });
  }

  function resizeBlobToBase64(blob, origFile){
    return new Promise(function(resolve){
      var MAX_PX = 1024, QUALITY = 0.65;
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function(){
        URL.revokeObjectURL(url);
        var w = img.width, h = img.height;
        if(w > MAX_PX || h > MAX_PX){
          if(w > h){ h = Math.round(h * MAX_PX / w); w = MAX_PX; }
          else { w = Math.round(w * MAX_PX / h); h = MAX_PX; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(outBlob){
          var reader = new FileReader();
          reader.onload = function(e){
            var base64 = e.target.result.split(',')[1];
            var origKB = Math.round(origFile.size/1024);
            var newKB  = Math.round(outBlob.size/1024);
            document.getElementById('prog-file').textContent =
              (origFile.name||'사진') + '  ' + origKB + 'KB → ' + newKB + 'KB';
            resolve({ base64: base64, mime: 'image/jpeg',
                      name: 'photo_' + Date.now() + '_' + Math.random().toString(36).slice(2,6) + '.jpg' });
          };
          reader.readAsDataURL(outBlob);
        }, 'image/jpeg', QUALITY);
      };
      img.onerror = function(){
        URL.revokeObjectURL(url);
        fileToBase64(origFile).then(resolve);
      };
      img.src = url;
    });
  }

  function fileToBase64(file){
    return new Promise(function(resolve){
      var reader = new FileReader();
      reader.onload = function(e){
        resolve({ base64: e.target.result.split(',')[1],
                  mime: file.type || 'image/jpeg',
                  name: file.name || ('photo_' + Date.now() + '.jpg') });
      };
      reader.readAsDataURL(file);
    });
  }

  // ── GAS 전송 (Promise) ──
  function sendToGAS(fileInfo){
    var body = JSON.stringify({
      co: params.co, site: params.site, date: params.date,
      siteId: params.siteId,
      name: fileInfo.name, data: fileInfo.base64, mime: fileInfo.mime
    });
    return fetch(GAS_URL, { method: 'POST', body: body })
      .then(function(r){ return r.json(); })
      .then(function(d){ return d.ok ? 'ok' : 'fail'; })
      .catch(function(){ return 'fail'; });
  }

  // ── 파일 1장 처리 (리사이즈 + 전송) ──
  function processOne(file){
    return resizeFileToBase64(file)
      .then(function(info){ return sendToGAS(info); })
      .then(function(result){
        if(result === 'ok') done++; else failed++;
        updateProgress(done + failed, total);
      })
      .catch(function(){
        failed++;
        updateProgress(done + failed, total);
      });
  }

  // ── 동시 최대 CONCURRENCY장 병렬 업로드 ──
  function runPool(files, concurrency){
    var queue = files.slice();
    var active = 0;
    return new Promise(function(resolveAll){
      function next(){
        while(active < concurrency && queue.length){
          active++;
          var file = queue.shift();
          processOne(file).then(function(){
            active--;
            if(queue.length === 0 && active === 0) resolveAll();
            else next();
          });
        }
      }
      next();
    });
  }

  runPool(Array.from(selectedFiles), CONCURRENCY).then(function(){
    onDone(done, failed);
  });
}

function updateProgress(done, total){
  var pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-text').textContent = done + ' / ' + total + '장 업로드 중...';
  document.getElementById('prog-pct').textContent = pct + '%';
}

function onDone(done, failed){
  isUploading = false;
  document.getElementById('prog-wrap').style.display = 'none';

  if(failed === 0){
    // Firebase에 보고 완료 기록 (/data/photos/{date}/{siteId} 구조)
    if(params.siteId && params.date && FB_URL){
      var fbPath = FB_URL + '/data/photos/' + params.date + '/' + params.siteId + '.json';
      fetch(fbPath)
        .then(function(r){ return r.json(); })
        .then(function(existing){
          var prev = (existing && existing.photos) ? existing.photos : 0;
          return fetch(fbPath, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ photos: prev + done, lastUpload: new Date().toISOString() })
          });
        })
        .catch(function(){});

      // reportLog 기록 — 보고 완료
      var logPath = FB_URL + '/data/reportLog/' + params.siteId + '/' + params.date + '.json';
      fetch(logPath, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ count: done, reportedAt: new Date().toISOString() })
      }).catch(function(){});

      // reportStart 기록 — 첫 보고일 (이미 있으면 덮어쓰지 않음)
      var startPath = FB_URL + '/data/reportStart/' + params.siteId + '.json';
      fetch(startPath)
        .then(function(r){ return r.json(); })
        .then(function(existing){
          if(!existing){
            return fetch(startPath, {
              method: 'PUT',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(params.date)
            });
          }
        })
        .catch(function(){});
    }

    // 완료 카드 표시, 업로드 카드 숨김
    document.getElementById('upload-card').style.display = 'none';
    var sc = document.getElementById('success-card');
    sc.style.display = '';
    document.getElementById('success-count').textContent = done + '장';
    document.getElementById('success-path').innerHTML =
      '<strong>' + (params.site || '') + '</strong> 현장 사진 ' + done + '장이<br>성공적으로 저장되었습니다.';

    // 텔레그램 알림 발송 (메모 있을 때만)
    var memo = (document.getElementById('memo-input')||{}).value||'';
    memo = memo.trim();
    if(memo) sendTelegramNotification(done, memo);
  } else {
    var eb = document.getElementById('err-box');
    eb.textContent = done + '장 성공, ' + failed + '장 실패. 실패한 사진을 다시 업로드해주세요.';
    eb.style.display = '';
    document.getElementById('upload-card').style.display = '';
    var btn = document.getElementById('upload-btn');
    btn.disabled = false;
    document.getElementById('upload-btn-text').textContent = '📤 다시 업로드';
  }
}

// ── 초기화 (추가 업로드용) ──
function sendTelegramNotification(photoCount, memo){
  if(!TG_TOKEN || !TG_CHAT_ID) return;

  var site = params.site || '알 수 없는 현장';
  var co   = params.co   || '';
  var date = params.date || '';

  function sendMsg(clientMgr){
    var sender = site + (clientMgr ? ' · ' + clientMgr : '');
    var lines = [
      '📸 <b>' + sender + '</b>',
      '📅 ' + date + ' | 📷 ' + photoCount + '장 업로드',
    ];
    if(co) lines.push('🏢 ' + co);
    if(memo){
      lines.push('');
      lines.push('📝 <b>에로사항</b>');
      lines.push(memo);
    }
    fetch('https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: TG_CHAT_ID, text: lines.join('\n'), parse_mode: 'HTML' })
    }).catch(function(){});
  }

  // Firebase sites에서 clientMgr 조회
  if(FB_URL && params.siteId){
    fetch(FB_URL + '/data/sites.json')
      .then(function(r){ return r.json(); })
      .then(function(sitesData){
        var found = Array.isArray(sitesData)
          ? sitesData.find(function(s){ return String(s.id) === String(params.siteId); })
          : null;
        sendMsg(found && found.clientMgr ? found.clientMgr : '');
      })
      .catch(function(){ sendMsg(''); });
  } else {
    sendMsg('');
  }
}

function resetUpload(){
  selectedFiles = [];
  document.getElementById('preview-grid').innerHTML = '';
  document.getElementById('upload-zone').classList.remove('has-files');
  document.getElementById('err-box').style.display = 'none';
  document.getElementById('prog-wrap').style.display = 'none';
  document.getElementById('success-card').style.display = 'none';
  document.getElementById('upload-card').style.display = '';
  document.getElementById('file-input').value = '';
  updateBtn();
}

// ── 드래그앤드롭 ──
function initDrop(){
  var zone = document.getElementById('upload-zone');
  if(!zone) return;
  zone.addEventListener('dragover', function(e){ e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', function(){ zone.classList.remove('drag'); });
  zone.addEventListener('drop', function(e){
    e.preventDefault(); zone.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });
}

window.onload = function(){ init(); initDrop(); updateBtn(); };
</script>
