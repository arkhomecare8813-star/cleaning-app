<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>현장 사진 업로드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
<style>
:root{
  --bg:#0a0a0a;--sf:#161616;--sf2:#1e1e1e;--sf3:#272727;
  --bd:#2c2c2c;--accent:#00e5a0;--a2:#004d36;
  --yellow:#ffb547;--ya2:#3a2800;
  --text:#f0f0f0;--muted:#777;--danger:#ff4d6d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 80px;}
.wrap{width:100%;max-width:480px;}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
.logo-icon{width:38px;height:38px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.logo-title{font-size:18px;font-weight:900;letter-spacing:-0.5px;}
.logo-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:14px;}

/* 현장 정보 */
.info-rows{display:flex;flex-direction:column;gap:12px;}
.info-row{display:flex;align-items:flex-start;gap:10px;}
.info-icon{font-size:18px;width:24px;flex-shrink:0;}
.info-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px;}
.info-val{font-size:15px;font-weight:800;}
.info-val.accent{color:var(--accent);}
.date-pill{display:inline-flex;align-items:center;gap:5px;background:var(--a2);color:var(--accent);padding:4px 12px;border-radius:20px;font-size:13px;font-weight:700;font-family:'DM Mono',monospace;}

/* 업로드 존 */
.upload-zone{border:2px dashed var(--bd);border-radius:14px;padding:30px 20px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--sf2);position:relative;}
.upload-zone.drag{border-color:var(--accent);background:rgba(0,229,160,0.06);}
.upload-zone.has-files{border-color:var(--accent);border-style:solid;}
.upload-zone.receipt-zone{border-color:var(--ya2);}
.upload-zone.receipt-zone.has-files{border-color:var(--yellow);}
.upload-big-icon{font-size:44px;margin-bottom:10px;line-height:1;}
.upload-text{font-size:15px;font-weight:800;margin-bottom:4px;}
.upload-sub{font-size:12px;color:var(--muted);line-height:1.6;}

/* 미리보기 */
.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.preview-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sf3);}
.preview-item img{width:100%;height:100%;object-fit:cover;display:block;}
.preview-remove{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,0.75);color:#fff;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;font-weight:900;}
.preview-more{aspect-ratio:1;border-radius:10px;background:var(--sf3);border:1px dashed var(--bd);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);cursor:pointer;font-weight:700;}

/* 업로드 버튼 */
.upload-btn{width:100%;padding:16px;border-radius:13px;background:var(--accent);border:none;color:#000;font-size:16px;font-weight:900;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;}
.upload-btn:hover{filter:brightness(1.1);}
.upload-btn:active{transform:scale(0.98);}
.upload-btn:disabled{background:var(--sf3);color:var(--muted);cursor:not-allowed;transform:none;}

/* 진행바 */
.prog-wrap{margin-top:14px;display:none;}
.prog-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;color:var(--muted);}
.prog-bar{background:var(--sf3);border-radius:6px;height:8px;overflow:hidden;}
.prog-fill{background:var(--accent);height:100%;border-radius:6px;transition:width 0.3s;width:0%;}
.prog-file{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* 완료 */
.success{text-align:center;padding:24px 10px;}
.success-emoji{font-size:64px;margin-bottom:14px;line-height:1;}
.success-title{font-size:22px;font-weight:900;color:var(--accent);margin-bottom:6px;}
.success-count{font-family:'DM Mono',monospace;font-size:32px;font-weight:900;color:var(--accent);margin:10px 0;}
.success-path{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:16px;}
.success-path strong{color:var(--accent);}
.add-more{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}

/* 에러 */
.err-box{background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.3);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--danger);margin-top:12px;display:none;line-height:1.6;}

/* 잘못된 링크 */
.invalid{text-align:center;padding:40px 20px;}
.invalid-icon{font-size:48px;margin-bottom:14px;}
.invalid-title{font-size:18px;font-weight:800;margin-bottom:6px;}
.invalid-sub{font-size:13px;color:var(--muted);}

/* 메모 */
.memo-input{width:100%;margin-top:12px;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:12px;color:var(--text);font-size:14px;font-family:'Noto Sans KR',sans-serif;resize:vertical;min-height:80px;outline:none;line-height:1.6;}
.memo-input:focus{border-color:#444;}

/* 비품 토글 */
.supply-toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--sf2);border:1px solid var(--bd);border-radius:12px;cursor:pointer;margin-top:14px;transition:all 0.2s;user-select:none;}
.supply-toggle:active{transform:scale(0.98);}
.supply-toggle.on{background:var(--ya2);border-color:var(--yellow);}
.supply-toggle-left{display:flex;align-items:center;gap:10px;}
.supply-toggle-icon{font-size:22px;}
.supply-toggle-title{font-size:14px;font-weight:800;}
.supply-toggle-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.supply-toggle.on .supply-toggle-title{color:var(--yellow);}
.supply-toggle-arrow{font-size:18px;color:var(--muted);transition:transform 0.25s;}
.supply-toggle.on .supply-toggle-arrow{transform:rotate(180deg);color:var(--yellow);}

/* 비품 패널 */
.supply-panel{display:none;background:var(--sf);border:1px solid var(--ya2);border-radius:12px;padding:16px;margin-top:8px;}
.supply-panel.open{display:block;}
.supply-label{font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:0.3px;}
.supply-input{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:9px;padding:11px 13px;color:var(--text);font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;margin-bottom:12px;}
.supply-input:focus{border-color:var(--yellow);}
.supply-input::placeholder{color:#444;}
.supply-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="logo-row">
    <div class="logo-icon">🧹</div>
    <div>
      <div class="logo-title" id="app-title">청소팀 관리</div>
      <div class="logo-sub">현장 사진 업로드</div>
    </div>
  </div>

  <!-- 잘못된 링크 -->
  <div class="card" id="invalid-card" style="display:none;">
    <div class="invalid">
      <div class="invalid-icon">❌</div>
      <div class="invalid-title">잘못된 링크입니다</div>
      <div class="invalid-sub">담당자에게 올바른 링크를 요청하세요.</div>
    </div>
  </div>

  <!-- 현장 정보 -->
  <div class="card" id="info-card">
    <div class="info-rows">
      <div class="info-row">
        <div class="info-icon">🏢</div>
        <div><div class="info-lbl">업체</div><div class="info-val" id="info-co">—</div></div>
      </div>
      <div class="info-row">
        <div class="info-icon">📍</div>
        <div><div class="info-lbl">현장</div><div class="info-val accent" id="info-site">—</div></div>
      </div>
      <div class="info-row">
        <div class="info-icon">📅</div>
        <div><div class="info-lbl">날짜</div><div class="date-pill" id="info-date">—</div></div>
      </div>
      <div class="info-row" id="mgr-row" style="display:none;">
        <div class="info-icon">👤</div>
        <div><div class="info-lbl">담당자</div><div class="info-val" id="info-mgr">—</div></div>
      </div>
    </div>
  </div>

  <!-- 업로드 카드 -->
  <div class="card" id="upload-card">

    <!-- 현장 사진 업로드 존 -->
    <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
      <div class="upload-big-icon">📸</div>
      <div class="upload-text">현장 사진을 탭해서 선택하세요</div>
      <div class="upload-sub">여러 장 동시 선택 가능 · JPG · PNG · HEIC</div>
    </div>
    <input type="file" id="file-input" accept="image/*" multiple onchange="handleFiles(this.files, 'photo')">
    <div class="preview-grid" id="preview-grid"></div>

    <!-- 에로사항 메모 -->
    <textarea id="memo-input" class="memo-input" placeholder="📝 에로사항 메모 (선택사항)&#10;특이사항, 요청사항 등을 입력하세요"></textarea>

    <!-- 비품 구매 토글 -->
    <div class="supply-toggle" id="supply-toggle" onclick="toggleSupply()">
      <div class="supply-toggle-left">
        <div class="supply-toggle-icon">🛒</div>
        <div>
          <div class="supply-toggle-title">비품 구매했어요</div>
          <div class="supply-toggle-sub">탭하면 영수증 등록란이 열립니다</div>
        </div>
      </div>
      <div class="supply-toggle-arrow">▼</div>
    </div>

    <!-- 비품 패널 -->
    <div class="supply-panel" id="supply-panel">
      <div class="supply-row">
        <div>
          <div class="supply-label">품목명</div>
          <input type="text" id="supply-item" class="supply-input" placeholder="예: 세제, 걸레, 장갑" style="margin-bottom:0;">
        </div>
        <div>
          <div class="supply-label">금액 (원)</div>
          <input type="number" id="supply-amount" class="supply-input" placeholder="예: 15000" inputmode="numeric" style="margin-bottom:0;">
        </div>
      </div>
      <div style="margin-top:12px;">
        <div class="supply-label">영수증 사진</div>
        <div class="upload-zone receipt-zone" id="receipt-zone" onclick="document.getElementById('receipt-input').click()">
          <div class="upload-big-icon" style="font-size:36px;">🧾</div>
          <div class="upload-text" style="font-size:14px;">영수증 사진 선택</div>
          <div class="upload-sub">선택 안 해도 등록 가능</div>
        </div>
        <input type="file" id="receipt-input" accept="image/*" multiple onchange="handleFiles(this.files, 'receipt')" style="display:none;">
        <div class="preview-grid" id="receipt-preview-grid"></div>
      </div>
    </div>

    <!-- 업로드 버튼 -->
    <button class="upload-btn" id="upload-btn" onclick="startUpload()" disabled>
      <span id="upload-btn-text">사진을 먼저 선택해주세요</span>
    </button>

    <!-- 진행바 -->
    <div class="prog-wrap" id="prog-wrap">
      <div class="prog-top">
        <span id="prog-text">업로드 중...</span>
        <span id="prog-pct">0%</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
      <div class="prog-file" id="prog-file"></div>
    </div>
    <div class="err-box" id="err-box"></div>
  </div>

  <!-- 완료 카드 -->
  <div class="card" id="success-card" style="display:none;">
    <div class="success">
      <div class="success-emoji">✅</div>
      <div class="success-title">업로드 완료!</div>
      <div class="success-count" id="success-count">0장</div>
      <div class="success-path" id="success-path"></div>
      <button class="add-more" onclick="resetUpload()">📷 사진 추가하기</button>
    </div>
  </div>

</div>

<script>
// ── 설정 ──
var GAS_URL = 'https://script.google.com/macros/s/AKfycbxOVap39LwyxR1bS58myL8kt-L9djapQp_lsuwRWBImvE0iFfXypSXK36PWv3wiGMLs/exec';
var RECEIPT_GAS_URL = GAS_URL; // 메인 GAS에 handleReceipt 포함되어 있음
var FB_URL = 'https://cleaning-498705-default-rtdb.asia-southeast1.firebasedatabase.app';
var TG_TOKEN = '';
var TG_CHAT_ID = '';

// Firebase에서 텔레그램 설정 로드
if(FB_URL){
  fetch(FB_URL+'/data/tgConfig.json')
    .then(function(r){return r.json();})
    .then(function(d){
      if(d && d.token)  TG_TOKEN   = d.token;
      if(d && d.chatId) TG_CHAT_ID = d.chatId;
    }).catch(function(){});
}

var params = {};
var selectedFiles = [];    // 현장 사진
var receiptFiles  = [];    // 영수증 사진
var supplyOpen    = false;

// ── URL 파라미터 파싱 ──
function parseParams(){
  location.search.slice(1).split('&').forEach(function(p){
    var i = p.indexOf('=');
    if(i > -1) params[decodeURIComponent(p.slice(0,i))] = decodeURIComponent(p.slice(i+1));
  });
}

// ── 초기화 ──
function init(){
  parseParams();
  if(!params.co || !params.site || !params.date){
    document.getElementById('info-card').style.display = 'none';
    document.getElementById('upload-card').style.display = 'none';
    document.getElementById('invalid-card').style.display = '';
    return;
  }
  if(params.title) document.getElementById('app-title').textContent = params.title;
  document.getElementById('info-co').textContent   = params.co;
  document.getElementById('info-site').textContent = params.site;
  document.getElementById('info-date').textContent = params.date;
  if(params.mgr){
    document.getElementById('info-mgr').textContent = params.mgr;
    document.getElementById('mgr-row').style.display = '';
  }
}

// ── 비품 토글 ──
function toggleSupply(){
  supplyOpen = !supplyOpen;
  var toggle = document.getElementById('supply-toggle');
  var panel  = document.getElementById('supply-panel');
  toggle.classList.toggle('on', supplyOpen);
  panel.classList.toggle('open', supplyOpen);
  updateBtn();
}

// ── 파일 선택 ──
function handleFiles(files, type){
  var arr = (type === 'receipt') ? receiptFiles : selectedFiles;
  for(var i=0;i<files.length;i++){
    var f = files[i];
    var isDup = arr.some(function(s){
      return s.name===f.name && s.size===f.size && s.lastModified===f.lastModified;
    });
    if(!isDup) arr.push(f);
  }
  if(type === 'receipt') renderReceiptPreviews();
  else renderPreviews();
  updateBtn();
}

function renderPreviews(){
  renderGrid(selectedFiles, 'preview-grid', 'photo', 'upload-zone');
}

function renderReceiptPreviews(){
  renderGrid(receiptFiles, 'receipt-preview-grid', 'receipt', 'receipt-zone');
}

function renderGrid(arr, gridId, type, zoneId){
  var grid = document.getElementById(gridId);
  grid.innerHTML = '';
  var show = Math.min(arr.length, 8);
  for(var i=0;i<show;i++){
    (function(idx){
      var div = document.createElement('div');
      div.className = 'preview-item';
      var img = document.createElement('img');
      var reader = new FileReader();
      reader.onload = function(e){ img.src = e.target.result; };
      reader.readAsDataURL(arr[idx]);
      var rm = document.createElement('button');
      rm.className = 'preview-remove';
      rm.innerHTML = '×';
      rm.onclick = function(e){
        e.stopPropagation();
        arr.splice(idx,1);
        if(type==='receipt') renderReceiptPreviews(); else renderPreviews();
        updateBtn();
      };
      div.appendChild(img); div.appendChild(rm);
      grid.appendChild(div);
    })(i);
  }
  if(arr.length > 8){
    var more = document.createElement('div');
    more.className = 'preview-more';
    more.textContent = '+' + (arr.length-8) + '장';
    grid.appendChild(more);
  }
  var zone = document.getElementById(zoneId);
  if(zone) zone.classList.toggle('has-files', arr.length > 0);
}

function updateBtn(){
  var btn = document.getElementById('upload-btn');
  var txt = document.getElementById('upload-btn-text');
  if(!btn) return;
  var hasPhoto   = selectedFiles.length > 0;
  var hasSupply  = supplyOpen && (
    (document.getElementById('supply-item')||{}).value ||
    (document.getElementById('supply-amount')||{}).value ||
    receiptFiles.length > 0
  );
  btn.disabled = !hasPhoto;
  if(hasPhoto){
    var label = '📤 현장사진 ' + selectedFiles.length + '장 업로드';
    if(supplyOpen && receiptFiles.length > 0) label += ' + 영수증 ' + receiptFiles.length + '장';
    txt.textContent = label;
  } else {
    txt.textContent = '사진을 먼저 선택해주세요';
  }
}

// ── 업로드 ──
var isUploading = false;
var CONCURRENCY = 3;

function startUpload(){
  if(!selectedFiles.length || isUploading) return;
  isUploading = true;

  var btn = document.getElementById('upload-btn');
  btn.disabled = true;
  document.getElementById('upload-btn-text').textContent = '⏳ 업로드 중...';
  document.getElementById('err-box').style.display = 'none';
  document.getElementById('prog-wrap').style.display = '';

  var total  = selectedFiles.length;
  var done   = 0;
  var failed = 0;
  updateProgress(0, total);

  // ── 리사이즈 유틸 ──
  function resizeFileToBase64(file){
    return new Promise(function(resolve){
      var isHeic = file.type==='image/heic'||file.type==='image/heif'||/\.(heic|heif)$/i.test(file.name||'');
      if(isHeic && typeof heic2any!=='undefined'){
        heic2any({blob:file,toType:'image/jpeg',quality:0.75})
          .then(function(blob){return resizeBlobToBase64(blob,file);})
          .catch(function(){return fileToBase64(file);})
          .then(resolve);
      } else {
        resizeBlobToBase64(file,file).then(resolve);
      }
    });
  }

  function resizeBlobToBase64(blob, origFile){
    return new Promise(function(resolve){
      var MAX_PX=1024, QUALITY=0.65;
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function(){
        URL.revokeObjectURL(url);
        var w=img.width, h=img.height;
        if(w>MAX_PX||h>MAX_PX){
          if(w>h){h=Math.round(h*MAX_PX/w);w=MAX_PX;}
          else{w=Math.round(w*MAX_PX/h);h=MAX_PX;}
        }
        var canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(function(outBlob){
          var reader=new FileReader();
          reader.onload=function(e){
            var b64=e.target.result.split(',')[1];
            var origKB=Math.round(origFile.size/1024);
            var newKB=Math.round(outBlob.size/1024);
            document.getElementById('prog-file').textContent=
              (origFile.name||'사진')+'  '+origKB+'KB → '+newKB+'KB';
            resolve({base64:b64,mime:'image/jpeg',
              name:'photo_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)+'.jpg'});
          };
          reader.readAsDataURL(outBlob);
        },'image/jpeg',QUALITY);
      };
      img.onerror=function(){URL.revokeObjectURL(url);fileToBase64(origFile).then(resolve);};
      img.src=url;
    });
  }

  function fileToBase64(file){
    return new Promise(function(resolve){
      var reader=new FileReader();
      reader.onload=function(e){
        resolve({base64:e.target.result.split(',')[1],mime:file.type||'image/jpeg',
          name:file.name||('photo_'+Date.now()+'.jpg')});
      };
      reader.readAsDataURL(file);
    });
  }

  // ── GAS 전송 ──
  function sendToGAS(fileInfo){
    var body=JSON.stringify({
      co:params.co, site:params.site, date:params.date, siteId:params.siteId,
      name:fileInfo.name, data:fileInfo.base64, mime:fileInfo.mime
    });
    return fetch(GAS_URL,{method:'POST',body:body})
      .then(function(r){return r.json();})
      .then(function(d){return d.ok?'ok':'fail';})
      .catch(function(){return 'fail';});
  }

  function processOne(file){
    return resizeFileToBase64(file)
      .then(function(info){return sendToGAS(info);})
      .then(function(result){
        if(result==='ok') done++; else failed++;
        updateProgress(done+failed, total);
      })
      .catch(function(){failed++;updateProgress(done+failed,total);});
  }

  function runPool(files, concurrency){
    var queue=files.slice(); var active=0;
    return new Promise(function(resolveAll){
      function next(){
        while(active<concurrency&&queue.length){
          active++;
          processOne(queue.shift()).then(function(){
            active--;
            if(queue.length===0&&active===0) resolveAll();
            else next();
          });
        }
      }
      next();
    });
  }

  runPool(Array.from(selectedFiles), CONCURRENCY).then(function(){
    onDone(done, failed);
  });
}

function updateProgress(done, total){
  var pct=total>0?Math.round(done/total*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-text').textContent=done+' / '+total+'장 업로드 중...';
  document.getElementById('prog-pct').textContent=pct+'%';
}

function onDone(done, failed){
  isUploading = false;
  document.getElementById('prog-wrap').style.display = 'none';

  if(failed === 0){
    // Firebase 보고 기록
    if(params.siteId && params.date && FB_URL){
      var fbPath = FB_URL+'/data/photos/'+params.date+'/'+params.siteId+'.json';
      fetch(fbPath).then(function(r){return r.json();}).then(function(existing){
        var prev=(existing&&existing.photos)?existing.photos:0;
        return fetch(fbPath,{method:'PUT',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({photos:prev+done,lastUpload:new Date().toISOString()})});
      }).catch(function(){});

      var logPath = FB_URL+'/data/reportLog/'+params.siteId+'/'+params.date+'.json';
      fetch(logPath,{method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({count:done,reportedAt:new Date().toISOString()})}).catch(function(){});

      var startPath = FB_URL+'/data/reportStart/'+params.siteId+'.json';
      fetch(startPath).then(function(r){return r.json();}).then(function(existing){
        if(!existing) return fetch(startPath,{method:'PUT',
          headers:{'Content-Type':'application/json'},body:JSON.stringify(params.date)});
      }).catch(function(){});
    }

    // 완료 카드 표시
    document.getElementById('upload-card').style.display = 'none';
    var sc = document.getElementById('success-card');
    sc.style.display = '';
    var receiptCount = supplyOpen ? receiptFiles.length : 0;
    var totalCount = done + receiptCount;
    document.getElementById('success-count').textContent = totalCount+'장';
    var pathHtml = '<strong>'+(params.site||'')+'</strong> 현장 사진 '+done+'장이<br>성공적으로 저장되었습니다.';
    if(receiptCount > 0) pathHtml += '<br><span style="color:var(--yellow,#ffb547);">🧾 영수증 '+receiptCount+'장도 함께 저장됩니다.</span>';
    document.getElementById('success-path').innerHTML = pathHtml;

    // 텔레그램 + 비품 처리
    var memo   = ((document.getElementById('memo-input')||{}).value||'').trim();
    var item   = ((document.getElementById('supply-item')||{}).value||'').trim();
    var amount = parseInt((document.getElementById('supply-amount')||{}).value||'0')||0;

    // clientMgr 조회 후 알림 발송
    function proceed(clientMgr){
      if(memo) sendTelegramMemo(done, memo, clientMgr);
      if(supplyOpen && (item || amount || receiptFiles.length)){
        processSupply(item, amount, clientMgr);
      }
    }

    if(FB_URL && params.siteId){
      fetch(FB_URL+'/data/sites.json')
        .then(function(r){return r.json();})
        .then(function(sitesData){
          var found=Array.isArray(sitesData)?sitesData.find(function(s){return String(s.id)===String(params.siteId);}):null;
          proceed(found&&found.clientMgr?found.clientMgr:'');
        }).catch(function(){proceed('');});
    } else { proceed(''); }

  } else {
    var eb = document.getElementById('err-box');
    eb.textContent = done+'장 성공, '+failed+'장 실패. 실패한 사진을 다시 업로드해주세요.';
    eb.style.display = '';
    document.getElementById('upload-card').style.display = '';
    var btn = document.getElementById('upload-btn');
    btn.disabled = false;
    document.getElementById('upload-btn-text').textContent = '📤 다시 업로드';
  }
}

// ── 텔레그램: 에로사항 메모 ──
function sendTelegramMemo(photoCount, memo, clientMgr){
  if(!TG_TOKEN||!TG_CHAT_ID) return;
  var sender = (params.site||'현장') + (clientMgr?' · '+clientMgr:'');
  var lines = [
    '📸 <b>'+sender+'</b>',
    '📅 '+(params.date||'')+' | 📷 '+photoCount+'장 업로드',
  ];
  if(params.co) lines.push('🏢 '+params.co);
  lines.push('');
  lines.push('📝 <b>에로사항</b>');
  lines.push(memo);
  fetch('https://api.telegram.org/bot'+TG_TOKEN+'/sendMessage',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({chat_id:TG_CHAT_ID,text:lines.join('\n'),parse_mode:'HTML'})
  }).catch(function(){});
}

// ── 비품 처리: 영수증 GAS 업로드 + 텔레그램 ──
function processSupply(item, amount, clientMgr){
  var date = params.date || new Date().toISOString().slice(0,10);

  // 영수증 사진이 있으면 GAS로 업로드 후 텔레그램에 사진 전송
  if(receiptFiles.length > 0){
    uploadReceiptFiles(item, amount, date, clientMgr);
  } else {
    // 사진 없이 Firebase supplies에만 기록 + 텔레그램 텍스트
    saveSupplyToFirebase(item, amount, date, null);
    sendTelegramSupplyText(item, amount, date, clientMgr, null);
  }
}

function uploadReceiptFiles(item, amount, date, clientMgr){
  var files = receiptFiles.slice();
  var uploadedUrls = [];
  var done = 0;
  var total = files.length;

  function uploadOne(file){
    return new Promise(function(resolve){
      // HEIC 변환
      var p = (file.type==='image/heic'||/\.heic$/i.test(file.name||''))&&typeof heic2any!=='undefined'
        ? heic2any({blob:file,toType:'image/jpeg',quality:0.85}).catch(function(){return file;})
        : Promise.resolve(file);

      p.then(function(converted){
        var fr = new FileReader();
        fr.onload = function(ev){
          var base64 = ev.target.result.split(',')[1];
          var body = JSON.stringify({
            type:'receipt',
            co: params.co||'미분류',
            site: params.site||'미분류',
            date: date,
            memo: item,
            amount: amount,
            siteId: String(params.siteId||''),
            name: 'receipt_'+Date.now()+'_'+Math.random().toString(36).slice(2,5)+'.jpg',
            data: base64,
            mime: converted.type||'image/jpeg'
          });
          fetch(RECEIPT_GAS_URL,{method:'POST',body:body})
            .then(function(r){return r.json();})
            .then(function(d){
              if(d.ok && d.url) uploadedUrls.push(d.url);
              done++;
              if(done===total){
                // Firebase supplies 저장
                var firstUrl = uploadedUrls[0]||null;
                saveSupplyToFirebase(item, amount, date, firstUrl);
                // 텔레그램: 첫번째 사진 + 텍스트
                sendTelegramSupplyPhoto(item, amount, date, clientMgr, base64, uploadedUrls);
              }
              resolve();
            })
            .catch(function(){ done++; if(done===total){ saveSupplyToFirebase(item, amount, date, null); sendTelegramSupplyText(item, amount, date, clientMgr, null); } resolve(); });
        };
        fr.readAsDataURL(converted instanceof Blob?converted:file);
      });
    });
  }

  // 순차 업로드 (영수증은 순서 보장)
  files.reduce(function(chain, file){
    return chain.then(function(){return uploadOne(file);});
  }, Promise.resolve());
}

function saveSupplyToFirebase(item, amount, date, url){
  if(!FB_URL||!params.siteId) return;
  var supId = String(Date.now()+Math.floor(Math.random()*1000));
  fetch(FB_URL+'/data/supplies/'+supId+'.json',{
    method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      id:parseInt(supId),
      co:params.co||'',
      siteId:String(params.siteId),
      siteName:params.site||'',
      item:item||'비품',
      amount:amount,
      date:date,
      receipt:!!url,
      url:url||''
    })
  }).catch(function(){});
}

// 텔레그램: 영수증 사진 있을 때 (sendPhoto API)
function sendTelegramSupplyPhoto(item, amount, date, clientMgr, base64, urls){
  if(!TG_TOKEN||!TG_CHAT_ID) return;
  var sender=(params.site||'현장')+(clientMgr?' · '+clientMgr:'');
  var amountStr=amount?Number(amount).toLocaleString()+'원':'금액 미입력';
  var caption=[
    '🧾 <b>비품 영수증 등록</b>',
    '📍 '+sender,
    '📅 '+date,
    '🏢 '+(params.co||''),
    '',
    '💰 <b>'+amountStr+'</b>',
    item?'📦 '+item:''
  ].filter(Boolean).join('\n');

  // base64 → Blob → FormData로 sendPhoto
  var byteChars = atob(base64);
  var byteArr = new Uint8Array(byteChars.length);
  for(var i=0;i<byteChars.length;i++) byteArr[i]=byteChars.charCodeAt(i);
  var blob = new Blob([byteArr],{type:'image/jpeg'});
  var fd = new FormData();
  fd.append('chat_id', TG_CHAT_ID);
  fd.append('caption', caption);
  fd.append('parse_mode','HTML');
  fd.append('photo', blob, 'receipt.jpg');

  fetch('https://api.telegram.org/bot'+TG_TOKEN+'/sendPhoto',{method:'POST',body:fd})
    .catch(function(){
      // 사진 전송 실패시 텍스트로 폴백
      sendTelegramSupplyText(item, amount, date, clientMgr, urls&&urls[0]?urls[0]:null);
    });
}

// 텔레그램: 영수증 사진 없을 때 (텍스트만)
function sendTelegramSupplyText(item, amount, date, clientMgr, url){
  if(!TG_TOKEN||!TG_CHAT_ID) return;
  var sender=(params.site||'현장')+(clientMgr?' · '+clientMgr:'');
  var amountStr=amount?Number(amount).toLocaleString()+'원':'금액 미입력';
  var lines=[
    '🧾 <b>비품 구매 보고</b>',
    '📍 '+sender,
    '📅 '+date,
    '🏢 '+(params.co||''),
    '',
    '💰 <b>'+amountStr+'</b>',
    item?'📦 '+item:'',
    url?'🔗 <a href="'+url+'">영수증 보기</a>':''
  ].filter(Boolean).join('\n');
  fetch('https://api.telegram.org/bot'+TG_TOKEN+'/sendMessage',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({chat_id:TG_CHAT_ID,text:lines.join('\n'),parse_mode:'HTML'})
  }).catch(function(){});
}

// ── 리셋 ──
function resetUpload(){
  selectedFiles = [];
  receiptFiles  = [];
  supplyOpen    = false;
  document.getElementById('preview-grid').innerHTML         = '';
  document.getElementById('receipt-preview-grid').innerHTML = '';
  document.getElementById('upload-zone').classList.remove('has-files');
  document.getElementById('receipt-zone').classList.remove('has-files');
  document.getElementById('supply-toggle').classList.remove('on');
  document.getElementById('supply-panel').classList.remove('open');
  document.getElementById('err-box').style.display    = 'none';
  document.getElementById('prog-wrap').style.display  = 'none';
  document.getElementById('success-card').style.display = 'none';
  document.getElementById('upload-card').style.display  = '';
  document.getElementById('file-input').value    = '';
  document.getElementById('receipt-input').value = '';
  document.getElementById('memo-input').value    = '';
  var si = document.getElementById('supply-item');   if(si) si.value='';
  var sa = document.getElementById('supply-amount'); if(sa) sa.value='';
  updateBtn();
}

// ── 드래그앤드롭 ──
function initDrop(){
  var zone = document.getElementById('upload-zone');
  if(!zone) return;
  zone.addEventListener('dragover',function(e){e.preventDefault();zone.classList.add('drag');});
  zone.addEventListener('dragleave',function(){zone.classList.remove('drag');});
  zone.addEventListener('drop',function(e){
    e.preventDefault();zone.classList.remove('drag');
    handleFiles(e.dataTransfer.files,'photo');
  });
}

window.onload = function(){ init(); initDrop(); updateBtn(); };
</script>
